/*
===============================================================================
Quality Checks
===============================================================================
Script Purpose:
    This script performs various quality checks for data consistency, accuracy, 
    and standardization across the 'silver' schemas. It includes checks for:
    - Null or duplicate primary keys.
    - Unwanted spaces in string fields.
    - Data standardization and consistency.
    - Invalid date ranges and orders.
    - Data consistency between related fields.
    - negative numbers.
    - relationships

Usage Notes:
    - Run these checks after data loading Silver Layer.
    - Investigate and resolve any discrepancies found during the checks.
===============================================================================
*/


-- ============================================================================
-- Checking 'silver_layer'
-- ============================================================================
-- Check for NULLs or Duplicates in Primary Key
-- Expectation: sucess

version: 2
models:
  - name: silver_products
    description: 'the table of products'
    columns:
      - name: product_id
        description: "Unique identifier for each product"
        tests:
          - unique
          - not_null
      - name: p_name
        description: "Name of the product"
        tests:
          - not_null 
      - name: category
        description: "Main category of the product"
        tests:
          - not_null
      - name: subcategory1
        description: "Subcategory of the product"
        tests:
          - not_null
      - name: selling_price
        description: "Retail selling price"
        data_tests:
          - not_null
          - non_negative
      - name: brand1
        description: "Brand name of the product"
        tests:
          - not_null
      - name: unit_cost
        description: "Cost price per unit"
        tests:
          - not_null
          - non_negative
      - name: weight_kg1
        description: "Product weight in kilograms"
        tests:
          - not_null
          - non_negative
         
      - name: is_active
        description: "Flag indicating whether product is active"
        tests:
          - not_null
      - name: created_at
        description: "Timestamp when the product was created"
        tests:
          - not_null
      - name: rec_level
        description: "Minimum inventory level before reordering"
        tests:
          - not_null
          - non_negative

  # ==========================================
  # 2.  (customers)
  # ==========================================
  - name: silver_customers
    description: "Staging model for customers data"
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: name
        data_tests:
          - not_null
      - name: segment
        data_tests:
          - not_null
      - name: country
        data_tests:
          - not_null
      - name: city
        data_tests:
          - not_null
      - name: date
        data_tests:
          - not_null
      - name: status
        data_tests:
          - not_null
# ==========================================
  # 3. (orders)
  # ==========================================
  - name: silver_orders
    description: "Staging model for orders data"
    columns:
      - name: order_id
        data_tests:
          - unique
