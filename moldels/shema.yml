    description: "Staging model for order line items"
    columns:
      - name: order_item_id
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - not_null
          -  unique   
          -  relationships:
            
              to: ref('silver_orders')
              field: order_id
        
      - name: product_id
        data_tests:
          - not_null
      - name: quantity
        data_tests:
          - not_null
          - non_negative
      - name: unit_price
        data_tests:
          - not_null
          - non_negative
      - name: amount
        data_tests:
          - not_null
          - non_negative
      - name: discount1
        data_tests:
          - not_null
          - non_negative
# ==========================================
#   5-returns
